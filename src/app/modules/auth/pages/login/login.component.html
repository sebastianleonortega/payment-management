<div class="flex items-center justify-center min-h-screen bg-gray-100 ">
  <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-8 w-full max-w-sm">

    <h1 class="text-2xl font-bold mb-6 text-center text-gray-900 dark:text-gray-100">
      Iniciar sesión
    </h1>

    <form [formGroup]="formLogin" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <div>
        <label class="block mb-1 text-white text-sm font-medium">Usuario</label>
        <input
          formControlName="userName"
          type="text"
          placeholder="Ingresa tu usuario"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2
                     focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600"
        />
        @if (formLogin.get('username')?.invalid && formLogin.get('username')?.touched) {
          <p class="text-sm text-red-500 mt-1">El usuario es obligatorio</p>
        }
      </div>

      <div>
        <label class="block text-white mb-1 text-sm font-medium">Contraseña</label>
        <input
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2
                     focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600"
        />
        @if (formLogin.get('password')?.invalid && formLogin.get('password')?.touched) {
          <p  class="text-sm text-red-500 mt-1">La contraseña es obligatoria</p>
        }
      </div>
      <button
        type="submit"
        [disabled]="formLogin.invalid"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400
                   text-white font-semibold py-2 rounded-lg shadow-md transition-colors">
        Entrar
      </button>
    </form>
  </div>
</div>
